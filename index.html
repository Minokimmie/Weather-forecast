<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h2 class="app-title"><i class="fa-solid fa-cloud-sun"></i> Weather App</h2>
        
        <div class="search-box">
            <input type="text" id="city" class="form-control" placeholder="Nhập tên thành phố..." onkeypress="handleKeyPress(event)">
            <button class="btn btn-search" onclick="getWeather()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div id="result">
            <!-- Dữ liệu thời tiết sẽ được hiển thị ở đây -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
